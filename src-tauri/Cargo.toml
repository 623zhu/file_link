[package]
name = "file-link"
version = "0.1.0"
description = "本地文件链接管理器"
authors = ["you"]
edition = "2024"

[lib]
name = "file_link_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
dunce = "1"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
walkdir = "2"
notify = "8"
notify-debouncer-full = "0.6"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
